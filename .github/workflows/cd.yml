name: CD

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://psplover16.github.io/Japanese_Word_Practice_Vue_AI/' || 'https://psplover16.github.io/Japanese_Word_Practice_Vue_AI/staging/' }}
    env:
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deployment paths
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "PUBLISH_SUBDIR=" >> "$GITHUB_ENV"
            echo "VITE_APP_BASE_PATH=/${REPO_NAME}/" >> "$GITHUB_ENV"
            echo "VITE_APP_START_URL=/${REPO_NAME}/" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_SUBDIR=staging" >> "$GITHUB_ENV"
            echo "VITE_APP_BASE_PATH=/${REPO_NAME}/staging/" >> "$GITHUB_ENV"
            echo "VITE_APP_START_URL=/${REPO_NAME}/staging/" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        run: npm run build

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to GitHub Pages branch
        run: node scripts/publishPages.mjs --source dist --branch gh-pages --target-subdir "$PUBLISH_SUBDIR"
