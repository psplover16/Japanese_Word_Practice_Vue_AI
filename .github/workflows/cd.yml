name: CD

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://psplover16.github.io/Japanese_Word_Practice_Vue_AI/' || 'https://psplover16.github.io/Japanese_Word_Practice_Vue_AI/staging/' }}
    env:
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deployment paths
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "PUBLISH_SUBDIR=" >> "$GITHUB_ENV"
            echo "VITE_APP_BASE_PATH=/${REPO_NAME}/" >> "$GITHUB_ENV"
            echo "VITE_APP_START_URL=/${REPO_NAME}/" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_SUBDIR=staging" >> "$GITHUB_ENV"
            echo "VITE_APP_BASE_PATH=/${REPO_NAME}/staging/" >> "$GITHUB_ENV"
            echo "VITE_APP_START_URL=/${REPO_NAME}/staging/" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        run: npm run build

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare GitHub Pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --force .deploy-pages origin/gh-pages
            cd .deploy-pages
            git checkout -B gh-pages
          else
            git worktree add --detach .deploy-pages HEAD
            cd .deploy-pages
            git checkout --orphan gh-pages
            git rm -rf --ignore-unmatch .
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

      - name: Sync static site into GitHub Pages branch
        env:
          DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          node ./scripts/publishPages.mjs --worktree .deploy-pages --dist dist --target "${DEPLOY_TARGET}"
          touch .deploy-pages/.nojekyll

      - name: Commit and push GitHub Pages content
        run: |
          cd .deploy-pages
          git add -A

          DEPLOY_LABEL="${PUBLISH_SUBDIR:-production}"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No publish changes to commit for ${DEPLOY_LABEL}."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          git commit -m "deploy: publish ${DEPLOY_LABEL} (${SHORT_SHA})"
          git push origin gh-pages:gh-pages

      - name: Cleanup GitHub Pages worktree
        if: always()
        run: git worktree remove --force .deploy-pages || rm -rf .deploy-pages
